<header class="flex items-center gap-3 border-b border-white/5 px-4 py-3">
  <svg class="h-7 w-7 shrink-0" viewBox="0 0 32 32" aria-hidden="true">
    <rect x="2" y="18" width="28" height="12" rx="2" fill="#f6f6f2" />
    <rect x="8" y="18" width="3" height="7" fill="#16161a" />
    <rect x="15" y="18" width="3" height="7" fill="#16161a" />
    <rect x="22" y="18" width="3" height="7" fill="#16161a" />
    <rect x="5" y="3" width="4" height="12" rx="1.5" fill="#42a5f5" />
    <rect x="14" y="8" width="4" height="7" rx="1.5" fill="#78d65c" />
    <rect x="23" y="1" width="4" height="14" rx="1.5" fill="#42a5f5" />
  </svg>
  <span class="font-semibold text-white">TuxGuitar → Piano</span>
  @if (store.song(); as song) {
    <span class="hidden min-w-0 truncate text-sm text-slate-400 sm:inline">
      {{ store.fileName() }} · {{ song.format.label }}
    </span>
  }
  <a
    href="https://github.com/Helias/tuxguitar-synthesia-converter"
    target="_blank"
    rel="noopener noreferrer"
    class="ml-auto shrink-0 rounded-md p-1.5 text-slate-400 hover:bg-slate-800 hover:text-white"
    aria-label="Source code on GitHub"
    title="Source code on GitHub"
  >
    <svg viewBox="0 0 16 16" class="h-6 w-6" fill="currentColor" aria-hidden="true">
      <path
        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
      />
    </svg>
  </a>
</header>

@if (store.song() && store.error()) {
  <p class="mx-4 mt-3 rounded-lg bg-red-500/10 px-4 py-2 text-sm text-red-300" role="alert">
    {{ store.error() }}
  </p>
}

<main
  class="grid flex-1 gap-4 p-4 lg:grid-cols-[minmax(0,1fr)_22rem]"
  [class.hidden]="!store.song()"
>
  <!-- Until the user resizes a panel, the column is sized by the grid row (it has no height of
       its own), so the video fills what the viewport leaves. -->
  <div
    class="flex min-w-0 flex-col gap-4 lg:data-fit:[contain:size]"
    [attr.data-fit]="layout.userSized() ? null : ''"
  >
    <app-preview-player
      #player
      class="lg:min-h-64 lg:flex-1"
      [style.height.px]="layout.videoHeight()"
      [style.flex]="layout.videoHeight() === null ? null : 'none'"
    />
    <app-resize-handle
      class="-my-3 hidden lg:flex"
      label="Resize video"
      [height]="playerHeight"
      (resized)="layout.videoHeight.set($event)"
    />
    <app-notation-panel />
  </div>
  <aside class="flex flex-col gap-4">
    <label
      class="block cursor-pointer rounded-xl bg-slate-900 px-4 py-2.5 text-center text-sm font-medium text-slate-200 ring-1 ring-white/10 hover:bg-slate-800"
    >
      Open another file
      <input #another type="file" class="sr-only" (change)="openAnother(another)" />
    </label>
    <div class="flex flex-col gap-2.5">
      <app-track-table />
      <app-options-panel />
      <app-export-panel />
    </div>
  </aside>
</main>

@if (!store.song()) {
  <app-upload />
}

<footer class="mt-auto border-t border-white/5 px-4 py-3 text-center text-xs text-slate-500">
  Coded by
  <a
    href="https://stefanoborzi.dev"
    target="_blank"
    rel="noopener noreferrer"
    class="text-slate-300 hover:text-white hover:underline"
    >Stefano Borzì</a
  >
</footer>
