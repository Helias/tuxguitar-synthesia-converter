name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Project pages live under /<repository>/.
      - run: npm run build -- --base-href "/${{ github.event.repository.name }}/"
      # Angular has no server-side routes; 404.html makes deep links fall back to the app.
      - run: cp dist/tuxguitar-synthesia-converter/browser/index.html dist/tuxguitar-synthesia-converter/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/tuxguitar-synthesia-converter/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
